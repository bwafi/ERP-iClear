# Docker development stack ERP iClear
#
# Meniru konfigurasi container yang sudah berjalan:
#   - PHP 7.4          -> service erp-app (build dari docker/php74)
#   - MariaDB 10.6     -> service erp-db, hostname jaringan: erp-db
#   - Adminer          -> service erp-adminer, host port 8081
#   - source code      -> bind mount ./ ke /app
#   - database volume  -> volume external erp-db-data (dipakai ulang, tidak dibuat baru)
#
# PENTING:
#   - Jangan jalankan `docker compose down -v` (bisa menghapus data).
#   - Port 8080/8081 harus bebas saat `docker compose up`.
#   - Nama container yang dihasilkan: erp-iclear-erp-app-1, erp-iclear-erp-db-1,
#     erp-iclear-erp-adminer-1 (tidak bentrok dengan container lama erp-app/erp-db).

name: erp-iclear

services:
  erp-db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-erp_local}
      MARIADB_USER: ${MARIADB_USER:-erp}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-erp}
    volumes:
      - erp-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  erp-app:
    build:
      context: ./docker/php74
    image: erp-php74:local
    restart: unless-stopped
    depends_on:
      erp-db:
        condition: service_healthy
    working_dir: /app
    # Samakan UID/GID dengan user host agar file yang dibuat aplikasi
    # (log, cache, upload) tidak jadi milik root.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    command: ["php", "spark", "serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./:/app

  erp-adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      erp-db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: erp-db
    ports:
      - "8081:8080"

volumes:
  erp-db-data:
    external: true
    name: erp-db-data
